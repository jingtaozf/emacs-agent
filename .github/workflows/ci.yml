name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DEPS_DIR: /tmp/deps
  # purcell/setup-emacs uses Nix, whose GitHub flake fetches 403 on
  # anonymous shared-runner IPs.  Auth it with the workflow token.
  NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

jobs:
  check:
    name: lint + unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      # Pre-configure Nix with the token BEFORE setup-emacs installs
      # Nix — the workflow-level NIX_CONFIG alone is insufficient
      # because install-nix writes /etc/nix/nix.conf first.
      - name: Pre-configure Nix access token
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}" \
            >> ~/.config/nix/nix.conf

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Elisp dependencies
        run: |
          mkdir -p $DEPS_DIR
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git $DEPS_DIR/literate-elisp
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git $DEPS_DIR/web-server

      - name: make check
        run: |
          make check \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
