name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DEPS_DIR: /tmp/deps

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Elisp dependencies
        run: |
          mkdir -p $DEPS_DIR
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git $DEPS_DIR/literate-elisp
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git $DEPS_DIR/web-server
          git clone --depth 1 https://github.com/company-mode/company-mode.git $DEPS_DIR/company
          git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git $DEPS_DIR/websocket
          git clone --depth 1 https://github.com/joaotavora/yasnippet.git $DEPS_DIR/yasnippet

      - name: Run smoke tests
        run: |
          make test-smoke \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company \
            WEBSOCKET_DIR=$DEPS_DIR/websocket \
            YASNIPPET_DIR=$DEPS_DIR/yasnippet

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: smoke
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Elisp dependencies
        run: |
          mkdir -p $DEPS_DIR
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git $DEPS_DIR/literate-elisp
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git $DEPS_DIR/web-server
          git clone --depth 1 https://github.com/company-mode/company-mode.git $DEPS_DIR/company
          git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git $DEPS_DIR/websocket
          git clone --depth 1 https://github.com/joaotavora/yasnippet.git $DEPS_DIR/yasnippet

      - name: Run agent unit tests
        run: |
          make test-agent-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company \
            WEBSOCKET_DIR=$DEPS_DIR/websocket \
            YASNIPPET_DIR=$DEPS_DIR/yasnippet

      - name: Run org unit tests
        run: |
          make test-org-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company \
            WEBSOCKET_DIR=$DEPS_DIR/websocket \
            YASNIPPET_DIR=$DEPS_DIR/yasnippet

      - name: Run backend unit tests
        run: |
          make test-backend-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company \
            WEBSOCKET_DIR=$DEPS_DIR/websocket \
            YASNIPPET_DIR=$DEPS_DIR/yasnippet

      - name: Run MCP server unit tests
        run: |
          make test-mcp-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company \
            WEBSOCKET_DIR=$DEPS_DIR/websocket \
            YASNIPPET_DIR=$DEPS_DIR/yasnippet

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Elisp dependencies
        run: |
          mkdir -p $DEPS_DIR
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git $DEPS_DIR/literate-elisp
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git $DEPS_DIR/web-server
          git clone --depth 1 https://github.com/company-mode/company-mode.git $DEPS_DIR/company
          git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git $DEPS_DIR/websocket
          git clone --depth 1 https://github.com/joaotavora/yasnippet.git $DEPS_DIR/yasnippet

      - name: Run lint
        run: |
          make lint \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company \
            WEBSOCKET_DIR=$DEPS_DIR/websocket \
            YASNIPPET_DIR=$DEPS_DIR/yasnippet

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history — gitleaks needs all commits, not just HEAD
          submodules: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE not required for OSS repos

  pr-size:
    name: PR Size Cap (≤ 400 LOC)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Compute changed lines vs base
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Exclude lockfiles + auto-generated artifacts from the count;
          # they make PRs look big without representing reviewer cognitive load.
          EXCLUDED=':(exclude)*.lock' ':(exclude)uv.lock' ':(exclude)package-lock.json' \
                   ':(exclude)pnpm-lock.yaml' ':(exclude)yarn.lock' ':(exclude)Cargo.lock' \
                   ':(exclude)*.min.js' ':(exclude)*.min.css'
          STAT=$(git diff --shortstat "$BASE...$HEAD" -- . $EXCLUDED || true)
          echo "shortstat: $STAT"
          ADDED=$(echo "$STAT" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          DELETED=$(echo "$STAT" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo 0)
          TOTAL=$((ADDED + DELETED))
          echo "added=$ADDED  deleted=$DELETED  total=$TOTAL"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Enforce 400-LOC ceiling
        run: |
          TOTAL="${{ steps.diff.outputs.total }}"
          if [ "$TOTAL" -gt 400 ]; then
            echo "::error::PR is $TOTAL LOC (added+deleted), exceeds 400-line ceiling."
            echo "::error::Split into smaller PRs (target 200, hard cap 400). See CLAUDE.md."
            echo "::error::Lockfiles/min.js are already excluded from the count."
            echo "::error::To intentionally bypass, add label 'big-pr-ok' to this PR."
            # Allow a manual override via PR label
            LABELS=$(jq -r '.pull_request.labels[].name' < "$GITHUB_EVENT_PATH" || echo "")
            if echo "$LABELS" | grep -qx "big-pr-ok"; then
              echo "::warning::label 'big-pr-ok' present — letting PR through despite size."
              exit 0
            fi
            exit 1
          fi
          echo "PR size OK ($TOTAL LOC)."
