name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install literate-elisp
        run: |
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git /tmp/literate-elisp

      - name: Install web-server
        run: |
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git /tmp/web-server

      - name: Run smoke tests
        run: |
          make test-smoke \
            LITERATE_ELISP_DIR=/tmp/literate-elisp \
            WEB_SERVER_DIR=/tmp/web-server \
            COMPANY_DIR=/tmp

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: smoke
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install literate-elisp
        run: |
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git /tmp/literate-elisp

      - name: Install web-server
        run: |
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git /tmp/web-server

      - name: Run agent unit tests
        run: |
          make test-agent-unit \
            LITERATE_ELISP_DIR=/tmp/literate-elisp \
            WEB_SERVER_DIR=/tmp/web-server \
            COMPANY_DIR=/tmp

      - name: Run org unit tests
        run: |
          make test-org-unit \
            LITERATE_ELISP_DIR=/tmp/literate-elisp \
            WEB_SERVER_DIR=/tmp/web-server \
            COMPANY_DIR=/tmp

      - name: Run backend unit tests
        run: |
          make test-backend-unit \
            LITERATE_ELISP_DIR=/tmp/literate-elisp \
            WEB_SERVER_DIR=/tmp/web-server \
            COMPANY_DIR=/tmp

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install literate-elisp
        run: |
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git /tmp/literate-elisp

      - name: Install web-server
        run: |
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git /tmp/web-server

      - name: Run lint
        run: |
          make lint \
            LITERATE_ELISP_DIR=/tmp/literate-elisp \
            WEB_SERVER_DIR=/tmp/web-server \
            COMPANY_DIR=/tmp
