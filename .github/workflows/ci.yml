name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DEPS_DIR: /tmp/deps

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Elisp dependencies
        run: |
          mkdir -p $DEPS_DIR
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git $DEPS_DIR/literate-elisp
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git $DEPS_DIR/web-server
          git clone --depth 1 https://github.com/company-mode/company-mode.git $DEPS_DIR/company

      - name: Run smoke tests
        run: |
          make test-smoke \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: smoke
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Elisp dependencies
        run: |
          mkdir -p $DEPS_DIR
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git $DEPS_DIR/literate-elisp
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git $DEPS_DIR/web-server
          git clone --depth 1 https://github.com/company-mode/company-mode.git $DEPS_DIR/company

      - name: Run agent unit tests
        run: |
          make test-agent-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company

      - name: Run org unit tests
        run: |
          make test-org-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company

      - name: Run backend unit tests
        run: |
          make test-backend-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company

      - name: Run MCP server unit tests
        run: |
          make test-mcp-unit \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Elisp dependencies
        run: |
          mkdir -p $DEPS_DIR
          git clone --depth 1 https://github.com/jingtaozf/literate-elisp.git $DEPS_DIR/literate-elisp
          git clone --depth 1 https://github.com/eschulte/emacs-web-server.git $DEPS_DIR/web-server
          git clone --depth 1 https://github.com/company-mode/company-mode.git $DEPS_DIR/company

      - name: Run lint
        run: |
          make lint \
            LITERATE_ELISP_DIR=$DEPS_DIR/literate-elisp \
            WEB_SERVER_DIR=$DEPS_DIR/web-server \
            COMPANY_DIR=$DEPS_DIR/company
