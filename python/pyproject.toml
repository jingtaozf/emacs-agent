[project]
name = "code-agent-cli"
version = "0.1.0"
description = "Python CLI tools for the Claude Agent Emacs SDK"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.optional-dependencies]
phoenix = [
    "arize-phoenix>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # Property-based testing for non-trivial pure functions (lens #15 of
    # AI codebase mastery research). Random-input fuzzing surfaces edge
    # cases that fixed-input unit tests miss — particularly important
    # because LLM-generated test inputs cluster around training-data
    # patterns and miss real corner cases.
    "hypothesis>=6.0",
    # Approval/characterization tests (lens #8, #16). Capture the *current*
    # behaviour as a baseline; future changes that drift from baseline
    # require explicit re-approval. Gold-master testing for refactor /
    # framework migration safety.
    "approvaltests>=14.0",
]

[project.scripts]
claude-workspace = "code_agent.claude_workspace:main"
copilot-workspace = "code_agent.copilot_workspace:main"
opencode-workspace = "code_agent.opencode_workspace:main"
workspace-bridge = "code_agent.workspace_bridge:main"
otel-bridge = "code_agent.otel_bridge:run_server"

[tool.hatch.build.targets.wheel]
packages = ["code_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
