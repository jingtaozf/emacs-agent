[project]
name = "claude-agent-cli"
version = "0.1.0"
description = "Python CLI tools for the Claude Agent Emacs SDK"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
iterm2 = ["iterm2>=2.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
claude-sdd = "claude_agent.claude_sdd:main"
sdd-bridge = "claude_agent.sdd_bridge:main"
iterm2-ctl = "claude_agent.iterm2_ctl:main"

[tool.hatch.build.targets.wheel]
packages = ["claude_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
