[project]
name = "claude-agent-cli"
version = "0.1.0"
description = "Python CLI tools for the Claude Agent Emacs SDK"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tracing = [
    "flask>=3.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
phoenix = [
    "arize-phoenix>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
claude-workspace = "claude_agent.claude_workspace:main"
workspace-bridge = "claude_agent.workspace_bridge:main"
otel-bridge = "claude_agent.otel_bridge:run_server"

[tool.hatch.build.targets.wheel]
packages = ["claude_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
