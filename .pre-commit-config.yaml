# Pre-commit hooks for claude-agent.
#
# Currently the project's primary pre-commit gate is `make check` (run via
# .git/hooks/pre-commit). This file adds *fast, surgical* checks on top:
#
# - gitleaks: scan staged content for secrets (lens #10 of AI codebase mastery).
#
# Activate locally with:  pip install pre-commit && pre-commit install
# CI runs the same checks via .github/workflows/ci.yml (job: secrets).
#
# Reference: https://pre-commit.com/

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Stop the commit on any leak. To intentionally bypass for a known-safe
        # value, add `// gitleaks:allow` on the same line (NOT recommended for
        # real secrets — rotate them instead).

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']  # block accidentally-committed binaries / dumps
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Don't strip trailing whitespace inside Markdown line-break syntax
        args: ['--markdown-linebreak-ext=md']

# Note: do NOT add black / isort / ruff here — they conflict with literate-elisp
# Python blocks (formatting differs inside .org src blocks). Keep formatting
# inside Makefile or per-file scripts.
