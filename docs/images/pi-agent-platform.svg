<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif; } .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }</style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ay" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Emacs Agent Platform — Pi as the engine, org as one plugin</text>
  <rect x="40" y="56" width="880" height="118" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="78" font-size="12" font-weight="600" fill="#374151">L2 · Surfaces (ours, thin — independently loadable)</text>
  <rect x="60" y="90" width="150" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="135" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">chat</text>
  <text x="135" y="132" text-anchor="middle" font-size="10.5" fill="#6b7280">upstream as-is</text>
  <text x="135" y="147" text-anchor="middle" font-size="10.5" fill="#6b7280">chat + input pair</text>
  <rect x="230" y="90" width="170" height="66" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="315" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">pi-topic</text>
  <text x="315" y="132" text-anchor="middle" font-size="10.5" fill="#6b7280">org tasks / KB · accepted</text>
  <text x="315" y="147" text-anchor="middle" font-size="10.5" fill="#6b7280">Goal · Result · GTD</text>
  <rect x="420" y="90" width="150" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="495" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">pi-ask</text>
  <text x="495" y="132" text-anchor="middle" font-size="10.5" fill="#6b7280">minibuffer one-shot</text>
  <text x="495" y="147" text-anchor="middle" font-size="10.5" fill="#6b7280">GTD 2-minute rule</text>
  <rect x="620" y="90" width="280" height="66" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="760" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7280">later</text>
  <text x="760" y="132" text-anchor="middle" font-size="10.5" fill="#9ca3af">magit commit msgs · compile-fix</text>
  <text x="760" y="147" text-anchor="middle" font-size="10.5" fill="#9ca3af">(no region-rewrite surface — gptel/elysium own it)</text>
  <rect x="40" y="200" width="560" height="118" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="56" y="222" font-size="12" font-weight="600" fill="#c2410c">L0 · Engine — pi-coding-agent (upstream, MELPA ≥ 2.7) public API</text>
  <text x="70" y="246" font-size="11" fill="#6b7280" class="mono">pi-coding-agent-activity-phase-functions   ← turn lifecycle</text>
  <text x="70" y="266" font-size="11" fill="#6b7280" class="mono">pi-coding-agent-open-session-file          ← resume</text>
  <text x="70" y="286" font-size="11" fill="#6b7280" class="mono">pi-coding-agent-run-command                ← slash commands</text>
  <text x="70" y="306" font-size="11" fill="#6b7280">process + chat rendering owned upstream; gaps → upstream PRs, not advice</text>
  <rect x="640" y="200" width="130" height="50" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="705" y="222" text-anchor="middle" font-size="11" fill="#e5e7eb" class="mono">pi --mode rpc</text>
  <text x="705" y="240" text-anchor="middle" font-size="10" fill="#9ca3af">one per session</text>
  <rect x="652" y="262" width="130" height="50" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="717" y="284" text-anchor="middle" font-size="11" fill="#e5e7eb" class="mono">pi --mode rpc</text>
  <text x="717" y="302" text-anchor="middle" font-size="10" fill="#9ca3af">concurrent</text>
  <path d="M 810,215 C 810,208 832,203 860,203 C 888,203 910,208 910,215 L 910,295 C 910,302 888,307 860,307 C 832,307 810,302 810,295 Z" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <path d="M 810,215 C 810,222 832,227 860,227 C 888,227 910,222 910,215" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <text x="860" y="252" text-anchor="middle" font-size="10" fill="#166534" class="mono">sessions/</text>
  <text x="860" y="268" text-anchor="middle" font-size="10" fill="#166534" class="mono">*.jsonl</text>
  <text x="860" y="288" text-anchor="middle" font-size="9.5" fill="#6b7280">full record</text>
  <rect x="40" y="344" width="880" height="108" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="56" y="366" font-size="12" font-weight="600" fill="#6d28d9">L1 · Bridge — emacs-mcp, both directions (ours)</text>
  <rect x="70" y="380" width="360" height="56" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="250" y="402" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">emacs-mcp-server (:9999) — Emacs tools for any agent</text>
  <text x="250" y="422" text-anchor="middle" font-size="10.5" fill="#6b7280" class="mono">evalElisp · report_invocation · (grow: diff-apply, project nav)</text>
  <rect x="470" y="380" width="430" height="56" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="685" y="402" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">emacs-mcp.ts — Pi-side client (global extension)</text>
  <text x="685" y="422" text-anchor="middle" font-size="10.5" fill="#6b7280" class="mono">emacs_eval · org_result · org_goal · kb_search (org-ql / rg)</text>
  <rect x="40" y="478" width="880" height="92" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="56" y="500" font-size="12" font-weight="600" fill="#15803d">L3 · Memory — the org knowledge base (ours)</text>
  <text x="480" y="524" text-anchor="middle" font-size="11" fill="#374151">topic Results + archives + notes — the agent consults it through kb_search and writes back through org_result</text>
  <text x="480" y="544" text-anchor="middle" font-size="10.5" fill="#6b7280">editor-native RAG: org-ql / ripgrep, no external index service (khoj lesson)</text>
  <line x1="315" y1="156" x2="315" y2="198" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="135" y1="156" x2="180" y2="198" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="495" y1="156" x2="440" y2="198" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="600" y1="240" x2="638" y2="228" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="590" y="243" width="56" height="13" fill="#ffffff" opacity="0.95"/>
  <text x="618" y="253" text-anchor="middle" font-size="9.5" fill="#2563eb">RPC stdio</text>
  <line x1="782" y1="280" x2="808" y2="272" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ag)"/>
  <line x1="705" y1="312" x2="690" y2="378" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ay)"/>
  <rect x="702" y="336" width="120" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="762" y="347" text-anchor="middle" font-size="9.5" fill="#6b7280">extensions run in-process</text>
  <line x1="470" y1="408" x2="432" y2="408" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="250" y1="436" x2="250" y2="476" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="256" y="448" width="150" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="331" y="459" text-anchor="middle" font-size="9.5" fill="#16a34a">org_result / kb_search hit org</text>
  <path d="M 920,300 C 940,380 940,460 900,500" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ay)"/>
  <rect x="878" y="392" width="64" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="910" y="403" text-anchor="middle" font-size="9.5" fill="#6b7280">PI_SESSION</text>
  <line x1="40" y1="596" x2="70" y2="596" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="78" y="600" font-size="11" fill="#6b7280">editor → agent (surfaces drive the engine; engine speaks RPC to pi)</text>
  <line x1="40" y1="616" x2="70" y2="616" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="78" y="620" font-size="11" fill="#6b7280">agent → editor (Pi calls Emacs tools over the bridge; writes into org memory)</text>
  <line x1="500" y1="596" x2="530" y2="596" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ay)"/>
  <text x="538" y="600" font-size="11" fill="#6b7280">containment / pointers</text>
</svg>
