<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif; } .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }</style>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ay" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Topic anatomy — org keeps the outcome, JSONL keeps the record</text>
  <rect x="40" y="56" width="540" height="330" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="56" y="78" font-size="12" fill="#6b7280" class="mono">topics.org</text>
  <text x="140" y="78" font-size="11" fill="#9ca3af">— folded view reads like an inbox</text>
  <rect x="60" y="92" width="500" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="114" font-size="12" class="mono" xml:space="preserve"><tspan fill="#6b7280">* </tspan><tspan fill="#c2410c" font-weight="600">REVIEW</tspan><tspan fill="#111827"> pgvector vs qdrant for wisdom store</tspan></text>
  <text x="72" y="132" font-size="10.5" fill="#6b7280" class="mono">:AGENT_TYPE: pi-topic  :PI_SESSION: ~/.pi/agent/sessions/….jsonl</text>
  <text x="72" y="148" font-size="10.5" fill="#6b7280" class="mono">:CUSTOM_ID: topic-pgvector-vs-qdrant</text>
  <rect x="60" y="172" width="500" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="172" width="4" height="56" rx="2" fill="#2563eb"/>
  <text x="76" y="192" font-size="12" font-weight="600" fill="#1d4ed8" class="mono">** Goal</text>
  <text x="76" y="212" font-size="12" fill="#111827" class="mono">Compare for 1M-row wisdom store; p95 &lt; 50 ms.</text>
  <rect x="60" y="240" width="500" height="122" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="60" y="240" width="4" height="122" rx="2" fill="#16a34a"/>
  <text x="76" y="260" font-size="12" font-weight="600" fill="#15803d" class="mono">** Result</text>
  <text x="76" y="280" font-size="12" fill="#111827" class="mono">Recommendation: pgvector — meets p95 at 1M rows.</text>
  <text x="76" y="298" font-size="12" fill="#111827" class="mono">| criterion | pgvector | qdrant |     ← org table</text>
  <text x="76" y="316" font-size="12" fill="#111827" class="mono">Rejected: qdrant — extra ops burden.</text>
  <text x="76" y="334" font-size="12" fill="#1d4ed8" class="mono">[[file:src/db.py::120]] · [[#topic-embeddings]]</text>
  <text x="56" y="404" font-size="10.5" fill="#9ca3af" font-style="italic">no Log section — the transcript lives in the chat buffer + session JSONL (decision 2026-08-13)</text>
  <line x1="562" y1="112" x2="596" y2="112" stroke="#d1d5db" stroke-width="1"/>
  <text x="600" y="108" font-size="11" fill="#6b7280">auto-named after turn 1</text>
  <text x="600" y="124" font-size="11" fill="#6b7280">PI_SESSION → resume pointer</text>
  <line x1="562" y1="196" x2="596" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <text x="600" y="200" font-size="11" fill="#6b7280">human-authored — edited, never appended</text>
  <rect x="640" y="224" width="180" height="46" rx="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="730" y="251" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">pi agent · each turn</text>
  <path d="M 640,247 C 605,252 590,265 564,278" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="572" y="284" width="70" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="607" y="295" text-anchor="middle" font-size="10.5" fill="#15803d">org_result</text>
  <line x1="562" y1="320" x2="596" y2="320" stroke="#d1d5db" stroke-width="1"/>
  <text x="600" y="316" font-size="11" fill="#6b7280">rewritten each turn — conclusion first;</text>
  <text x="600" y="332" font-size="11" fill="#6b7280">what the reviewer actually reads</text>
  <rect x="620" y="380" width="220" height="110" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="730" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">chat buffer · ephemeral</text>
  <text x="730" y="422" text-anchor="middle" font-size="10.5" fill="#6b7280">pi-coding-agent pair (chat + input)</text>
  <text x="730" y="439" text-anchor="middle" font-size="10.5" fill="#6b7280">streamed md · tool folds · diffs</text>
  <text x="730" y="456" text-anchor="middle" font-size="10.5" fill="#6b7280">steer C-c C-s · abort C-c C-k</text>
  <text x="730" y="476" text-anchor="middle" font-size="10.5" fill="#9ca3af">kill = reap · reopen = resume</text>
  <line x1="562" y1="360" x2="616" y2="400" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ay)"/>
  <rect x="548" y="372" width="86" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="591" y="383" text-anchor="middle" font-size="10.5" fill="#6b7280">watch / steer</text>
  <path d="M 660,535 C 660,524 713,516 780,516 C 847,516 900,524 900,535 L 900,625 C 900,636 847,644 780,644 C 713,644 660,636 660,625 Z" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <path d="M 660,535 C 660,546 713,554 780,554 C 847,554 900,546 900,535" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <text x="780" y="578" text-anchor="middle" font-size="11" fill="#166534" class="mono">~/.pi/agent/sessions/….jsonl</text>
  <text x="780" y="598" text-anchor="middle" font-size="10.5" fill="#6b7280">full fidelity: turns · thinking · tools</text>
  <text x="780" y="616" text-anchor="middle" font-size="10.5" fill="#6b7280">forks · compaction · branch summaries</text>
  <line x1="745" y1="490" x2="770" y2="512" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ay)"/>
  <rect x="770" y="492" width="120" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="830" y="503" text-anchor="middle" font-size="10" fill="#6b7280">renders the session</text>
  <path d="M 562,130 C 900,140 950,380 820,522" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ay)"/>
  <rect x="852" y="300" width="80" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="892" y="311" text-anchor="middle" font-size="10.5" fill="#6b7280">:PI_SESSION:</text>
  <line x1="40" y1="584" x2="70" y2="584" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="78" y="588" font-size="11" fill="#6b7280">agent-maintained write — org_result (org markup)</text>
  <line x1="40" y1="606" x2="70" y2="606" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ay)"/>
  <text x="78" y="610" font-size="11" fill="#6b7280">ephemeral view / full-fidelity store / pointers</text>
  <text x="40" y="646" font-size="11" font-weight="600" fill="#374151">Review contract: Goal + Result are the document —</text>
  <text x="40" y="664" font-size="11" font-weight="600" fill="#374151">the chat buffer is the workshop, the JSONL is the archive.</text>
</svg>
