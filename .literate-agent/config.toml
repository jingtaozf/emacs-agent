# Per-consumer config for literate-agent's renderer.
# Schema: ~/projects/literate-agent/docs/config.org
#
# Discovered by literate-agent scripts walking upward from CWD.
# Placeholders here expand ${PROJECT_NAMESPACE} etc. in rules /
# README templates rendered for this consumer.

[project]
namespace     = "code-agent"
display_name  = "Claude Agent SDK for Emacs"
author        = "Jingtao Xu"
repo_url      = "https://github.com/jingtaozf/emacs-agent"

[layout]
shape         = "plugin-consumer"

[paths]
literate_agent_home = "~/projects/literate-agent"
# Post-2026-08-13 cleanup the only tangle is the Pi TS extensions.
tangle_make_target  = "tangle-pi-extensions"

# Project-specific extras for this consumer (rendered into local
# templates only; literate-agent's own rules never reference these).
[placeholders.extra]
PROJECT_PI_HOME     = "~/.pi/agent"
